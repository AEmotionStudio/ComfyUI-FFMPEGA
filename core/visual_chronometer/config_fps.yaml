# Visual Chronometer — FPS Predictor configuration
# Vendored from Pulse-of-Motion (Apache 2.0)
# Only model params retained; data/lightning sections removed.

model:
  target: core.visual_chronometer.fps_predictor.FPSPredictor
  params:
    freeze_encoder: True
    hidden_dim: 1024
    warmup_steps: 200
    n_layers: 1

    # Encoder params
    embed_dim: 4
    use_quant_conv: True

    lossconfig:
      target: torch.nn.Identity

    ddconfig:
      double_z: True
      z_channels: 4
      resolution: 216
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      temporal_down_factor: 1
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    ppconfig:
      temporal_scale_factor: 4
      z_channels: 4
      out_ch: 4
      ch: 4
      attn_temporal_factor: []
